<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#141414">
    {{- with .Preview}}
    <meta name="description" content="{{.Description}}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Temporal">
    <meta property="og:title" content="{{.Title}}">
    <meta property="og:description" content="{{.Description}}">
    <meta property="og:url" content="{{.URL}}">
    <meta property="og:image" content="{{.ImageURL}}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Temporal logo">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{.Title}}">
    <meta name="twitter:description" content="{{.Description}}">
    <meta name="twitter:image" content="{{.ImageURL}}">
    {{- else}}
    <meta name="description" content="Stay in touch with Temporal after your event.">
    {{- end}}
    <title>Event follow-up · Temporal</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/forms.js" defer></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner wrap">
        <a class="brand" href="/" aria-label="Temporal event follow-up home">
          <img class="brand-logo" src="/static/temporal-logo.svg" width="172" height="44" alt="Temporal">
          <span class="brand-product">Event follow-up</span>
        </a>
        <span class="employee-identity" id="employee-identity" hidden></span>
      </div>
    </header>

    <main id="app" class="wrap" tabindex="-1" aria-busy="true">
      <p class="initial-loading" role="status">Loading…</p>
    </main>
    <noscript><p class="noscript wrap">Please enable JavaScript to use the event follow-up form.</p></noscript>

    <template id="home-template">
      <section class="form-page">
        <p class="eyebrow">Let's stay in touch</p>
        <h1>Pick up the conversation.</h1>
        <p class="intro">Scan your event's QR code or open the event link to share your details with the Temporal team.</p>
        <div class="card employee-entry">
          <h2>Temporal employee?</h2>
          <p>Create events, collect responses, and export your follow-ups.</p>
          <a class="button" id="home-login" href="/admin">Employee sign in</a>
        </div>
      </section>
    </template>

    <template id="internal-sign-in-template">
      <section class="form-page">
        <p class="eyebrow">Internal event</p>
        <h1>Sign in to respond.</h1>
        <p class="intro">This form is for Temporal employees. Sign in with your Temporal account and we'll bring you back here, with your name and email filled in.</p>
        <a class="button internal-sign-in" id="internal-sign-in" href="/">Sign in with Temporal</a>
      </section>
    </template>

    <template id="participant-template">
      <section class="form-page">
        <p class="eyebrow">Let's stay in touch</p>
        <h1 id="event-name"></h1>
        <p class="intro" id="event-description" hidden></p>
        <p class="intro" id="participant-intro">Leave your details and the Temporal team can follow up after the event.</p>
        <div id="event-closed" class="notice" hidden>
          <h2>Submissions have closed</h2>
          <p>This event is no longer accepting responses. Thanks for your interest in Temporal.</p>
        </div>
        <form id="participant-form" class="card form-card">
          <fieldset id="participant-fields"><legend class="visually-hidden">Event follow-up questions</legend></fieldset>
          <p class="feedback" id="participant-feedback" role="status" tabindex="-1" hidden></p>
          <p class="form-note">We'll use these details to follow up with you about this event.</p>
        </form>
        <div id="participant-success" class="card success-card" tabindex="-1" hidden>
          <span class="success-icon" aria-hidden="true">✓</span>
          <h2>You're all set.</h2>
          <p id="confirmation-message" class="confirmation-message"></p>
        </div>
      </section>
    </template>

    <template id="admin-template">
      <section class="admin-page">
        <div class="page-heading">
          <div><p class="eyebrow">Employee control panel</p><h1>Your events</h1><p class="intro">A simple place to collect your next conversation.</p></div>
          <button class="button" id="show-create" type="button" aria-expanded="false" aria-controls="create-section">Create event <span aria-hidden="true">+</span></button>
        </div>
        <section class="card create-section" id="create-section" hidden>
          <div class="create-heading"><div><p class="eyebrow">NEW EVENT</p><h2>Make the next conversation happen.</h2></div><div class="create-heading-actions"><span class="create-template-badge" id="create-template-badge">Contact template</span><button class="button secondary compact" id="import-form" type="button">Import form</button><input id="import-form-file" type="file" accept=".json,application/json" hidden></div></div>
          <form id="create-form">
            <fieldset id="create-fields"><legend class="visually-hidden">New event details</legend>
              <div class="event-settings-grid">
                <div class="field"><label for="create-name">Event name</label><input id="create-name" name="name" maxlength="120" required placeholder="e.g. Developer conference"></div>
                <div class="field"><label for="create-end-date">Last day for responses · UTC</label><input id="create-end-date" name="endDate" type="date" required aria-describedby="create-date-help"></div>
                <div class="field settings-description"><label for="create-description">Welcome message <span class="optional">Optional</span></label><textarea id="create-description" name="description" rows="2" maxlength="1000" placeholder="A short welcome for participants"></textarea></div>
              </div>
              <p class="field-help" id="create-date-help">Submissions close at midnight UTC after this date. Responses remain available to view and export for as long as Temporal retains them.</p>
              <label class="required-toggle internal-toggle"><input id="create-internal-only" name="internalOnly" type="checkbox" aria-describedby="create-internal-help"><span>Internal only</span></label>
              <p class="field-help" id="create-internal-help">Attendees sign in with their Temporal account to respond. Name and Email become fixed questions filled from that sign-in. You can also turn this on later under Edit questions, but an internal-only event can't go back to public.</p>
              <div id="form-builder" class="form-builder"></div>
              <section class="qr-settings"><div><p class="eyebrow">SHARE THE CONVERSATION</p><h2>Your QR display</h2><p class="field-help">A full-screen Temporal display for a phone, tablet, or event booth. You can update this message after creating the event.</p></div><div class="field"><label for="create-qr-banner">Banner message <span class="optional">Optional</span></label><textarea id="create-qr-banner" name="qrBanner" rows="2" maxlength="500" placeholder="Scan to stay in touch with the Temporal team."></textarea></div><div class="qr-banner-preview"><span class="qr-preview-mark" aria-hidden="true">▦</span><div><span class="metric-label">QR display message</span><p id="create-banner-preview">Scan to keep the conversation going.</p></div></div></section>
              <section class="preview-settings"><div><p class="eyebrow">SHARE THE LINK</p><h2>Your link preview</h2><p class="field-help">What Slack and other apps show when someone posts the event link. Blank fields use the event name and welcome message.</p></div><div><div class="field"><label for="create-preview-title">Preview title <span class="optional">Optional</span></label><input id="create-preview-title" maxlength="120" placeholder="Defaults to the event name"></div><div class="field"><label for="create-preview-description">Preview description <span class="optional">Optional</span></label><textarea id="create-preview-description" rows="2" maxlength="300" placeholder="Defaults to the welcome message"></textarea></div></div></section>
              <p class="field-help immutable-form-note">You can edit the questions later from the event page.</p>
              <div class="actions"><button class="button" id="create-submit" type="submit">Create event</button><button class="button secondary" id="cancel-create" type="button">Cancel</button></div>
            </fieldset>
            <p class="feedback" id="create-feedback" role="status" tabindex="-1" hidden></p>
          </form>
        </section>
        <p class="feedback" id="events-feedback" role="status" tabindex="-1" hidden></p>
        <div class="event-grid" id="event-list"></div>
        <div class="empty-state card" id="events-empty" hidden><h2>Start with an event.</h2><p>Create an event, share its QR code, and keep all of your responses together.</p></div>
        <button class="button secondary load-more" id="events-more" type="button" hidden>Load more events</button>
      </section>
    </template>

    <template id="detail-template">
      <section class="admin-page">
        <a class="back-link" href="/admin">← All events</a>
        <div class="page-heading detail-heading"><div><p class="eyebrow">Event responses</p><h1 id="detail-name"></h1><p class="intro" id="detail-description" hidden></p></div><span id="detail-status" class="status-badge"></span></div>
        <div class="card event-summary">
          <div class="event-metrics"><div><span class="metric-label">Responses</span><strong class="metric-value" id="detail-count"></strong></div><div><span class="metric-label">Submissions close</span><strong class="metric-date" id="detail-closes"></strong></div></div>
          <p id="detail-lifecycle" class="field-help"></p>
          <p id="detail-internal" class="field-help" hidden>Internal only: attendees sign in with their Temporal account, and their name and email come from that sign-in.</p>
          <div class="actions event-actions">
            <a class="button" id="detail-qr" target="_blank" rel="noopener" href="#">Display QR code <span class="visually-hidden">in a new tab</span><span aria-hidden="true">↗</span></a>
            <button class="button secondary" id="detail-copy" type="button">Copy form link</button>
            <button class="button secondary" id="detail-export" type="button">Export CSV <span aria-hidden="true">↓</span></button>
            <button class="button secondary" id="detail-duplicate" type="button">Duplicate event</button>
            <button class="button danger" id="detail-end" type="button">End event</button>
            <button class="button danger" id="detail-delete" type="button">Delete event</button>
          </div>
          <p class="feedback" id="detail-feedback" role="status" tabindex="-1" hidden></p>
        </div>
        <section class="card detail-banner-card"><div class="section-heading"><div><p class="eyebrow">EVENT DETAILS</p><h2>Update what attendees see.</h2></div></div><form id="details-form"><fieldset id="details-fields"><legend class="visually-hidden">Event details</legend><div class="event-settings-grid"><div class="field"><label for="detail-edit-name">Event name</label><input id="detail-edit-name" maxlength="120" required></div><div class="field"><label for="detail-edit-end-date">Last day for responses · UTC</label><input id="detail-edit-end-date" type="date" required aria-describedby="detail-edit-date-help"></div><div class="field settings-description"><label for="detail-edit-description">Welcome message <span class="optional">Optional</span></label><textarea id="detail-edit-description" rows="2" maxlength="1000" placeholder="A short welcome for participants"></textarea></div></div><p class="field-help" id="detail-edit-date-help"></p><div class="actions"><button class="button secondary" id="details-save" type="submit">Save details</button></div></fieldset><p class="feedback" id="details-feedback" role="status" tabindex="-1" hidden></p></form></section>
        <section class="card detail-banner-card"><div class="section-heading"><div><p class="eyebrow">EVENT LINK</p><h2>Choose the link people open.</h2></div></div><form id="slug-form"><div class="banner-edit-row"><div class="field"><label for="detail-slug">Link <span class="optional" id="detail-slug-origin"></span></label><input id="detail-slug" maxlength="39" required autocapitalize="none" spellcheck="false" aria-describedby="slug-help"></div><button class="button secondary" id="slug-save" type="submit">Save link</button></div><p class="field-help" id="slug-help"></p><p class="feedback" id="slug-feedback" role="status" tabindex="-1" hidden></p></form></section>
        <section class="card detail-banner-card"><div class="section-heading"><div><p class="eyebrow">LINK PREVIEW</p><h2>Choose how the link unfurls.</h2></div></div><form id="preview-form"><fieldset id="preview-fields"><legend class="visually-hidden">Link preview</legend><div class="field"><label for="detail-preview-title">Title <span class="optional">Optional</span></label><input id="detail-preview-title" maxlength="120"></div><div class="field"><label for="detail-preview-description">Description <span class="optional">Optional</span></label><textarea id="detail-preview-description" rows="2" maxlength="300"></textarea></div><p class="field-help">Slack and other apps show this when someone posts the event link. Blank fields use the event name and welcome message. Apps cache previews, so a link that was already posted can keep its old preview for a while.</p><div class="actions"><button class="button secondary" id="preview-save" type="submit">Save preview</button></div></fieldset><p class="feedback" id="preview-feedback" role="status" tabindex="-1" hidden></p></form></section>
        <section class="card detail-banner-card"><div class="section-heading"><div><p class="eyebrow">QR DISPLAY</p><h2>Set the message people see.</h2></div><a id="detail-form-preview" class="text-button" target="_blank" rel="noopener" href="#">Open attendee form ↗</a></div><form id="banner-form"><div class="banner-edit-row"><div class="field"><label for="detail-banner">Banner message <span class="optional">Optional</span></label><textarea id="detail-banner" rows="2" maxlength="500" placeholder="Scan to keep the conversation going."></textarea></div><button class="button secondary" id="banner-save" type="submit">Save message</button></div><p class="feedback" id="banner-feedback" role="status" tabindex="-1" hidden></p></form></section>
        <section class="card detail-form-card"><div class="section-heading"><div><p class="eyebrow">QUESTIONS</p><h2>Edit the attendee form.</h2></div><div class="form-card-actions"><button class="button secondary" id="form-export" type="button">Export form <span aria-hidden="true">↓</span></button><button class="button secondary" id="form-edit-toggle" type="button" aria-expanded="false" aria-controls="form-editor">Edit questions</button></div></div><form id="form-editor" hidden><fieldset id="form-editor-fields"><legend class="visually-hidden">Event questions</legend><label class="required-toggle internal-toggle"><input id="detail-internal-only" type="checkbox" aria-describedby="detail-internal-help"><span>Internal only</span></label><p class="field-help" id="detail-internal-help"></p><p class="field-help">Changes apply to new responses as soon as you save. Responses already collected keep their answers, but questions you remove no longer appear in the participant table or CSV export.</p><div id="detail-form-builder" class="form-builder"></div><div class="actions"><button class="button" id="form-save" type="submit">Save questions</button><button class="button secondary" id="form-cancel" type="button">Cancel</button></div></fieldset><p class="feedback" id="form-feedback" role="status" tabindex="-1" hidden></p></form></section>
        <div class="section-heading"><div><h2>Participants</h2><p class="field-help">Long answers are shortened here. Hover to read one, or export the CSV for every full response.</p></div><button class="text-button" id="refresh-leads" type="button">Refresh</button></div>
        <p class="feedback" id="leads-feedback" role="status" tabindex="-1" hidden></p>
        <div class="table-card card" id="leads-table-wrap" hidden>
          <table class="leads-table"><caption class="visually-hidden">Event participants</caption><thead><tr id="leads-head"></tr></thead><tbody id="leads-body"></tbody></table>
        </div>
        <div class="empty-state card" id="leads-empty" hidden><h2>No responses yet.</h2><p>Share the form link or display the QR code to get started.</p></div>
        <button class="button secondary load-more" id="leads-more" type="button" hidden>Load more participants</button>
        <dialog id="end-dialog" class="confirm-dialog" aria-labelledby="end-dialog-title" aria-describedby="end-dialog-description">
          <h2 id="end-dialog-title">End this event?</h2><p id="end-dialog-description">New responses will stop immediately. You can still view and export the responses already collected. This can’t be undone.</p>
          <p class="feedback" id="end-dialog-feedback" role="alert" hidden></p>
          <div class="dialog-actions"><button class="button secondary" id="cancel-end" type="button" autofocus>Keep event open</button><button class="button danger-solid" id="confirm-end" type="button">End event</button></div>
        </dialog>
        <dialog id="delete-dialog" class="confirm-dialog" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-description">
          <h2 id="delete-dialog-title">Delete this event?</h2><p id="delete-dialog-description">It will disappear from your events, and its form and QR code will stop opening. There’s no undo.</p>
          <p class="feedback" id="delete-dialog-feedback" role="alert" hidden></p>
          <div class="dialog-actions"><button class="button secondary" id="cancel-delete" type="button" autofocus>Keep event</button><button class="button danger-solid" id="confirm-delete" type="button">Delete event</button></div>
        </dialog>
      </section>
    </template>
  </body>
</html>
