apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: DemoProject
metadata:
  name: event-leads
spec:
  source:
    repo: https://github.com/temporal-sa/temporal-lead-follow-up-event-tracker
    branch: main
  registry:
    title: Event Lead Tracker
    summary: >-
      Built with Go, mobile-friendly HTML forms, and QR codes. Demonstrates
      entity Workflows that own each event and are the only writers to its
      permanent DynamoDB record, which outlives the Temporal Namespace. Use
      case: capturing and exporting event follow-up leads.
    tags: [Forms, Entity Workflows, DynamoDB]
    temporalSdks: [Go]
    links:
      runbook:
        label: Runbook
        url: https://github.com/temporal-sa/temporal-lead-follow-up-event-tracker/blob/main/RUNBOOK.md
  builds:
    app:
      context: .
      dockerfile: Dockerfile
  temporal:
    auth:
      mode: apiKey
    nexusEndpoints:
      event-leads-participants:
        targetTaskQueue: event-leads-store
        allowedCallerProjects:
          - podpocalypse
  components:
    web:
      build: app
      args: [serve]
      temporalAccess: true
      # Read-only access to the event table; created by deploy/create-store.sh.
      awsIamRoleArn: arn:aws:iam::429214323166:role/tmprl-dem-cld-event-leads-web
      env:
        - name: PUBLIC_URL
          value: https://events.tmprl-demo.cloud
        - name: AUTH_VERIFY_URL
          value: http://web.tmprl-dem-cld-registry-operator.svc.cluster.local/_auth/verify
        - name: TEMPORAL_TASK_QUEUE
          value: event-leads-store
        - name: EVENT_LEADS_TABLE
          value: tmprl-dem-cld-event-leads
        - name: AWS_REGION
          value: us-west-1
        # "true" on both components turns away every change, for maintenance.
        - name: WRITES_PAUSED
          value: "false"
      ports:
        - name: http
          containerPort: 8080
          servicePort: 80
    worker:
      build: app
      args: [worker]
      worker: true
      # Read/write access to the permanent event table; created by deploy/create-store.sh.
      awsIamRoleArn: arn:aws:iam::429214323166:role/tmprl-dem-cld-event-leads-worker
      env:
        - name: TEMPORAL_TASK_QUEUE
          value: event-leads-store
        - name: EVENT_LEADS_TABLE
          value: tmprl-dem-cld-event-leads
        - name: AWS_REGION
          value: us-west-1
        - name: WRITES_PAUSED
          value: "false"
  ingress:
    subdomain: events
    temporalAuthRequired: false
    component: web
    port: http
  smokeCheck:
    path: /healthz
    expectedStatus: 200
